<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 820" role="img" aria-labelledby="title desc">
  <title id="title">個人代表圖片</title>
  <desc id="desc">綠色漸層背景上的「你」字，請換成自己的照片</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b5ffcf"/>
      <stop offset=".52" stop-color="#3de68a"/>
      <stop offset="1" stop-color="#087241"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#062a1b" stroke-opacity=".12"/>
    </pattern>
  </defs>
  <rect width="720" height="820" rx="32" fill="url(#bg)"/>
  <rect width="720" height="820" rx="32" fill="url(#grid)"/>
  <circle cx="584" cy="130" r="82" fill="none" stroke="#eafff1" stroke-opacity=".7" stroke-width="2"/>
  <circle cx="584" cy="130" r="112" fill="none" stroke="#eafff1" stroke-opacity=".26" stroke-width="2"/>
  <text x="360" y="500" text-anchor="middle" font-family="Noto Sans TC, sans-serif" font-size="300" font-weight="900" fill="#061a12">你</text>
  <text x="54" y="752" font-family="monospace" font-size="24" font-weight="600" letter-spacing="5" fill="#062a1b">REPLACE WITH YOUR PHOTO</text>
</svg>
